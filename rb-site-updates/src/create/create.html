      if (P.music && bufs[P.music]) {
        var ms = c.createBufferSource(), mg = c.createGain(); ms.buffer = bufs[P.music]; ms.loop = true; ms.connect(mg); mg.connect(outG); mg.gain.value = P.musicVol;
        list.forEach(function(it){ it.lines.forEach(function(L){ if (!L.line.audio) return; var a = t0 + it.start - base + L.start; mg.gain.setTargetAtTime(P.musicVol * 0.3, a - 0.1, 0.05); mg.gain.setTargetAtTime(P.musicVol, a + L.dur + 0.1, 0.3); }); });
        mg.gain.setTargetAtTime(0, t0 + total - 1, 0.4); ms.start(t0); ms.stop(t0 + total + 0.2); srcs.push(ms);
      }
      cancelAnimationFrame(raf);
      playing = { srcs: srcs, out: outG };
      list.forEach(function(it){ var v = it.scene.bg.asset && media[it.scene.bg.asset]; if (v && v.play) v.currentTime = 0; });
      var loop = function(){
        if (!playing) return; var t = c.currentTime - t0; if (t < 0) t = 0;
        var it = list.filter(function(x){ return t >= x.start - base && t < x.start - base + x.dur; })[0] || list[list.length - 1];
        drawScene(g, cv.width, cv.height, it, t - (it.start - base), false);
        $("#f-time").textContent = fmt(t) + " / " + fmt(total);
        if (t >= total) { stop(); onEnd && onEnd(); return; }
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
      $("#f-play").textContent = "■ Stop";
      return outG;
    };
    var stop = function(){ if (!playing) return; playing.srcs.forEach(function(s){ try { s.stop(); } catch (x) {} }); try { playing.out.disconnect(); } catch (x) {} playing = null; $("#f-play").textContent = "▶ Play film"; raf = requestAnimationFrame(idle); };
    $("#f-play").onclick = function(){ if (playing) stop(); else loadAll().then(function(){ play(0, false); }); };
    $("#f-playscene").onclick = function(){ if (playing) stop(); loadAll().then(function(){ play(sel, true); }); };
    $("#f-export").onclick = function(){
      var b = this; b.disabled = true; stop();
      loadAll().then(function(){
        var pl = plan();
        return recordCanvas(cv, null, pl.total + 0.4, function(done){ var o = play(0, false, function(){ setTimeout(done, 300); }); if (o && exportDest) o.connect(exportDest); else done(); }, function(p){ status($("#f-xst"), "Exporting… " + Math.round(p * 100) + "%"); });
      }).then(function(blob){ return saveExport(blob, P.name || "RB film"); }).then(function(){ status($("#f-xst"), "Exported and saved to your library."); })
        .catch(function(e){ status($("#f-xst"), e.message); }).then(function(){ b.disabled = false; });
    };

    /* the panels */
    var drawCast = function(){
      $("#f-cast").innerHTML = P.cast.length ? P.cast.map(function(c){ return '<li><img class="thumb" alt="" data-cast-img="' + c.id + '"><div class="grow"><b>' + esc(c.name) + '</b><span class="small muted">' + (c.mouthAsset ? "Talks with a second picture" : c.mouth ? "Mouth set" : "Set the mouth so they talk") + '</span></div><button class="btn sm" type="button" data-mouth="' + c.id + '">Mouth</button><button class="btn sm" type="button" data-stage="' + c.id + '">On stage</button><button class="btn sm" type="button" data-uncast="' + c.id + '" aria-label="Remove ' + esc(c.name) + '">✕</button></li>'; }).join("") : '<li class="muted">No characters yet.</li>';
      P.cast.forEach(function(c){ Assets.get(c.asset).then(function(a){ var im = $('[data-cast-img="' + c.id + '"]'); if (a && im) { if (a.kind === "image") im.src = assetUrl(a); else im.alt = "clip"; } }); });
      $("#f-onstage").innerHTML = S().actors.map(function(a, i){ var c = castById(a.cast); return '<button type="button" class="btn sm' + (i === selActor ? " goldb" : "") + '" data-actor="' + i + '">' + esc(c ? c.name : "?") + "</button>"; }).join("") || '<span class="small muted">Nobody yet: press "On stage" next to a character.</span>';
      $("#f-actorctl").hidden = selActor < 0 || !S().actors[selActor];
      if (selActor >= 0 && S().actors[selActor]) $("#f-scale").value = S().actors[selActor].scale;
    };
    var drawLines = function(){
      var s = S();
      $("#f-lines").innerHTML = s.lines.length ? s.lines.map(function(l, i){
        return '<li class="colst"><div class="row"><select class="f1 in" data-lcast="' + i + '">' + P.cast.map(function(c){ return '<option value="' + c.id + '"' + (c.id === l.cast ? " selected" : "") + ">" + esc(c.name) + "</option>"; }).join("") + '</select><button class="btn sm" type="button" data-ldel="' + i + '">✕</button></div>' +
          '<textarea class="in" data-ltext="' + i + '" rows="2" placeholder="What they say">' + esc(l.text) + "</textarea>" +
          '<div class="row"><button class="btn sm" type="button" data-lai="' + i + '"><span class="ai">AI</span> Voice</button><button class="btn sm" type="button" data-lrec="' + i + '">● Record</button><button class="btn sm" type="button" data-llib="' + i + '">Audio…</button><span class="small muted">' + (l.audio ? "Has audio · " + fmt(bufs[l.audio] ? bufs[l.audio].duration : 0) : "No audio: reads for " + lineDur(l).toFixed(1) + " s") + "</span></div></li>";
      }).join("") : '<li class="muted">No lines. Add one, pick who says it, then give it a voice.</li>';
    };
    var drawScenes = function(){
      $("#f-scenes").innerHTML = P.scenes.map(function(s, i){ return '<button type="button" class="scn" data-scn="' + i + '" aria-pressed="' + (i === sel) + '"><canvas width="320" height="180"></canvas>' + (i + 1) + " · " + s.lines.length + " line" + (s.lines.length === 1 ? "" : "s") + "</button>"; }).join("") + '<button type="button" class="scn add" id="f-addscene" aria-label="Add a scene">+</button>';
      var pl = plan();
      $$("#f-scenes canvas").forEach(function(tc, i){ var it = pl.scenes[i]; if (it) drawScene(tc.getContext("2d"), 320, 180, it, Math.min(1.2, it.dur * 0.4), false); });
    };
    var drawSceneCtl = function(){
      var s = S();
      $$('[data-seg="camera"] button').forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.v === s.camera)); });
      $$('[data-seg="transition"] button').forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.v === s.transition)); });
      $("#f-bgc").value = (s.bg.color || "#120E0A").toLowerCase(); $("#f-min").value = s.min;
    };
    var redraw = function(){ drawCast(); drawLines(); drawScenes(); drawSceneCtl(); };
    var changed = function(){ save(); drawScenes(); };

    /* cast: add, AI draw, mouth point */
    var addChar = function(a){ var c = { id: uid("c_"), name: (a.name || "Character").replace(/\.[a-z0-9]+$/i, "").slice(0, 30), asset: a.id, mouth: null, mouthAsset: null }; P.cast.push(c); loadMedia(a.id).then(function(){ if (a.kind === "image") setMouth(c); }); save(); drawCast(); };
    $("#f-addchar").onclick = function(){ pickAsset(["image", "video"], "Pick or upload a character").then(function(a){ if (a) addChar(a); }); };
    $("#f-aichar").onclick = function(){
      var pr = prompt("Describe the character (AI image). Example: cartoon Bay Area rapper in a gold chain, full body, plain white background", "Cartoon character, full body, plain white background, ");
      if (!pr) return; status($("#f-st"), "Drawing the character (AI)…");
      aiImage(pr).then(function(a){ status($("#f-st"), "Character ready."); addChar(a); }).catch(function(e){ status($("#f-st"), e.message); });
    };
    var setMouth = function(c){
      Assets.get(c.asset).then(function(a){
        if (!a || a.kind !== "image") { alert("Mouth points work on pictures. For a clip, upload a second picture with the mouth open."); return; }
        var pt = c.mouth || { x: 0.5, y: 0.35, w: 0.12 };
        dlg.innerHTML = '<h2>Where is ' + esc(c.name) + '\'s mouth?</h2><p class="note">Click the middle of the mouth. While they talk, an animated mouth opens there with the voice. Or give a second picture with the mouth open and RB swaps to it on loud sounds.</p>' +
          '<div class="mouthpick" id="mp"><img alt="" src="' + assetUrl(a) + '"><i id="mpdot"></i></div><div class="mt10 f">MOUTH WIDTH<input type="range" id="mpw" min="0.03" max="0.4" step="0.01"></div>' +
          '<div class="mt12 row"><button class="btn" type="button" id="mp-open">Use a mouth-open picture…</button><span class="f1 sp"></span><button class="btn" type="button" id="mp-x">Cancel</button><button class="btn gold" type="button" id="mp-ok">Done</button></div>';
        var dot = $("#mpdot", dlg), place = function(){ dot.style.left = pt.x * 100 + "%"; dot.style.top = pt.y * 100 + "%"; dot.style.width = dot.style.height = "18px"; };
        $("#mpw", dlg).value = pt.w; place();
        $("#mp", dlg).onclick = function(e){ var r = this.getBoundingClientRect(); pt.x = (e.clientX - r.left) / r.width; pt.y = (e.clientY - r.top) / r.height; place(); };
        $("#mpw", dlg).oninput = function(){ pt.w = +this.value; };
        $("#mp-x", dlg).onclick = function(){ dlg.close(); };
        $("#mp-ok", dlg).onclick = function(){ c.mouth = pt; dlg.close(); save(); drawCast(); };
        $("#mp-open", dlg).onclick = function(){ dlg.close(); pickAsset(["image"], "Pick the mouth-open picture (same size and pose)").then(function(o){ if (o) { c.mouthAsset = o.id; loadMedia(o.id); save(); drawCast(); } }); };
        dlg.showModal();
      });
    };

    /* recording a line straight from the microphone */
    var recLine = function(i, btn){
      if (btn._stop) { btn._stop(); return; }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(ms){
        var mr = new MediaRecorder(ms), chunks = []; mr.ondataavailable = function(e){ if (e.data.size) chunks.push(e.data); };
        mr.onstop = function(){ ms.getTracks().forEach(function(t){ t.stop(); }); btn._stop = null; var blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
          Assets.add(blob, "audio", "Line · " + (S().lines[i].text || "").slice(0, 30)).then(function(a){ S().lines[i].audio = a.id; return loadMedia(a.id); }).then(function(){ changed(); drawLines(); }); };
        mr.start(); btn.textContent = "■ Stop"; btn._stop = function(){ mr.stop(); };
      }).catch(function(){ status($("#f-st"), "Microphone blocked. Allow it in the browser's address bar."); });
    };

    view.addEventListener("click", function(e){
      var t = e.target.closest("button") || e.target, d = t.dataset || {};
      if (d.scn !== undefined) { sel = +d.scn; selActor = -1; redraw(); return; }
      if (t.id === "f-addscene") { var ns = newScene(); var last = S(); ns.actors = last.actors.map(function(a){ return Object.assign({}, a); }); ns.bg = Object.assign({}, last.bg); P.scenes.push(ns); sel = P.scenes.length - 1; selActor = -1; changed(); redraw(); return; }
      if (t.id === "f-dup") { var cp = JSON.parse(JSON.stringify(S())); cp.id = uid("s_"); P.scenes.splice(sel + 1, 0, cp); sel++; changed(); redraw(); return; }
      if (t.id === "f-del") { if (P.scenes.length < 2) return; if (!confirm("Delete this scene?")) return; P.scenes.splice(sel, 1); sel = Math.max(0, sel - 1); changed(); redraw(); return; }
      if (t.id === "f-left" && sel > 0) { var x = P.scenes.splice(sel, 1)[0]; P.scenes.splice(--sel, 0, x); changed(); redraw(); return; }
      if (t.id === "f-right" && sel < P.scenes.length - 1) { var y = P.scenes.splice(sel, 1)[0]; P.scenes.splice(++sel, 0, y); changed(); redraw(); return; }
      if (d.mouth) { setMouth(castById(d.mouth)); return; }
      if (d.stage) { S().actors.push({ cast: d.stage, x: 0.3 + 0.4 * Math.random(), y: 0.95, scale: 1, flip: false }); selActor = S().actors.length - 1; changed(); drawCast(); return; }
      if (d.uncast) { if (!confirm("Remove this character from the film?")) return; P.cast = P.cast.filter(function(c){ return c.id !== d.uncast; }); P.scenes.forEach(function(s){ s.actors = s.actors.filter(function(a){ return a.cast !== d.uncast; }); s.lines = s.lines.filter(function(l){ return l.cast !== d.uncast; }); }); selActor = -1; changed(); redraw(); return; }
      if (d.actor !== undefined) { selActor = +d.actor; drawCast(); return; }
      if (t.id === "f-flip" && S().actors[selActor]) { S().actors[selActor].flip = !S().actors[selActor].flip; changed(); return; }
      if (t.id === "f-remove" && S().actors[selActor]) { S().actors.splice(selActor, 1); selActor = -1; changed(); drawCast(); return; }
      if (t.id === "f-addline") { if (!P.cast.length) { status($("#f-st"), "Add a character first."); return; } var who = S().actors[0] ? S().actors[0].cast : P.cast[0].id; S().lines.push({ id: uid("l_"), cast: who, text: "", audio: null }); changed(); drawLines(); return; }
      if (d.ldel !== undefined) { S().lines.splice(+d.ldel, 1); changed(); drawLines(); return; }
      if (d.lrec !== undefined) { recLine(+d.lrec, t); return; }
      if (d.llib !== undefined) { var li = +d.llib; pickAsset(["audio"], "Pick the line's audio").then(function(a){ if (!a) return; S().lines[li].audio = a.id; loadMedia(a.id).then(function(){ changed(); drawLines(); }); }); return; }
      if (d.lai !== undefined) {
        var L = S().lines[+d.lai]; if (!L.text.trim()) { status($("#f-st"), "Write the line first."); return; }
        t.disabled = true; status($("#f-st"), "Making the AI voice…");
        aiSpeech(L.text).then(function(a){ L.audio = a.id; return loadMedia(a.id); }).then(function(){ status($("#f-st"), "AI voice ready (Cloudflare Workers AI)."); changed(); drawLines(); }).catch(function(err){ status($("#f-st"), err.message); }).then(function(){ t.disabled = false; });
        return;
      }
      if (t.id === "f-bg") { pickAsset(["image", "video"], "Pick a background").then(function(a){ if (!a) return; S().bg.asset = a.id; loadMedia(a.id).then(changed); }); return; }
      if (t.id === "f-aibg") { var pr = prompt("Describe the scene's background (AI image):", "Cartoon city street at night, Oakland, neon gold signs, wide shot"); if (!pr) return; status($("#f-st"), "Drawing the background (AI)…"); aiImage(pr).then(function(a){ S().bg.asset = a.id; return loadMedia(a.id); }).then(function(){ status($("#f-st"), "Background ready."); changed(); }).catch(function(err){ status($("#f-st"), err.message); }); return; }
      if (t.id === "f-music") { pickAsset(["audio"], "Pick the music").then(function(a){ if (!a) return; P.music = a.id; $("#f-musicname").textContent = a.name; loadMedia(a.id).then(save); }); return; }
    });
    view.addEventListener("input", function(e){
      var t = e.target, d = t.dataset || {};
      if (d.ltext !== undefined) { S().lines[+d.ltext].text = t.value; clearTimeout(P._t); P._t = setTimeout(changed, 700); return; }
      if (t.id === "f-name") { P.name = t.value; clearTimeout(P._t); P._t = setTimeout(save, 600); }
      if (t.id === "f-scale" && S().actors[selActor]) { S().actors[selActor].scale = +t.value; clearTimeout(P._t); P._t = setTimeout(changed, 400); }
      if (t.id === "f-bgc") { S().bg.color = t.value.toUpperCase(); S().bg.asset = null; changed(); }
      if (t.id === "f-mvol") { P.musicVol = +t.value; save(); }
      if (t.id === "f-min") { S().min = Math.max(1, Math.min(60, +t.value || 3)); changed(); }
    });
    view.addEventListener("change", function(e){
      var t = e.target, d = t.dataset || {};
      if (d.lcast !== undefined) { S().lines[+d.lcast].cast = t.value; changed(); }
      if (t.id === "f-caps") { P.captions = t.checked; save(); }
    });
    bindSeg(view, function(name, v){ if (name === "aspect") { P.aspect = v; size(); } else S()[name] = v; changed(); });

    /* dragging characters on the stage */
    var pos = function(e){ var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; };
    cv.addEventListener("pointerdown", function(e){
      if (playing) return; var p = pos(e), s = S(), hit = -1;
      s.actors.forEach(function(a, i){ var c = castById(a.cast), im = c && media[c.asset]; if (!ready(im)) return; var h = 0.62 * a.scale, w = h * (im.naturalWidth || im.videoWidth) / (im.naturalHeight || im.videoHeight) * cv.height / cv.width; if (p.x > a.x - w / 2 && p.x < a.x + w / 2 && p.y > a.y - h && p.y < a.y) hit = i; });
      selActor = hit; drawCast(); if (hit < 0) return;
      dragging = { i: hit, dx: s.actors[hit].x - p.x, dy: s.actors[hit].y - p.y }; cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener("pointermove", function(e){ if (!dragging) return; var p = pos(e), a = S().actors[dragging.i]; a.x = Math.max(0, Math.min(1, p.x + dragging.dx)); a.y = Math.max(0.1, Math.min(1.4, p.y + dragging.dy)); });
    cv.addEventListener("pointerup", function(){ if (dragging) { dragging = null; changed(); } });

    loadAll().then(function(){ if (P.music) Assets.get(P.music).then(function(a){ if (a) $("#f-musicname").textContent = a.name; }); redraw(); raf = requestAnimationFrame(idle); });
    save();
    cleanup = function(){ stop(); cancelAnimationFrame(raf); Object.keys(media).forEach(function(k){ var v = media[k]; if (v && v.pause) v.pause(); }); };
  });
}

route();
})();
</script>
