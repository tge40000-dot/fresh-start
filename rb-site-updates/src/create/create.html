      $$('[data-seg="transition"] button').forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.v === s.transition)); });
      $("#f-bgc").value = (s.bg.color || "#120E0A").toLowerCase(); $("#f-min").value = s.min;
    };
    var redraw = function(){ drawCast(); drawLines(); drawScenes(); drawSceneCtl(); };
    var changed = function(){ save(); drawScenes(); };

    /* cast: add, AI draw, mouth point */
    var addChar = function(a, mouth){ var c = { id: uid("c_"), name: (a.name || "Character").replace(/\.[a-z0-9]+$/i, "").replace(/^AI character · /, "").slice(0, 30), asset: a.id, mouth: mouth || null, mouthAsset: null }; P.cast.push(c); loadMedia(a.id).then(function(){ if (a.kind === "image" && !mouth) setMouth(c); }); save(); drawCast(); return c; };
    /* cut a picture out of its plain background (a new picture; the original stays in the library) */
    var cutAsset = function(a){
      return Assets.get(a.id).then(function(full){ return new Promise(function(res){ var im = new Image(); im.onload = function(){ res(im); }; im.onerror = function(){ res(null); }; im.src = assetUrl(full); }); })
        .then(function(im){ var cut = im && DIRECTOR.cutout(im); if (!cut) return { asset: a, cut: false, mouth: null };
          return new Promise(function(res){ cut.canvas.toBlob(res, "image/png"); }).then(function(b){ return Assets.add(b, "image", (a.name || "Character").replace(/ · .*$/, "") + " · cut out", { ai: !!(a.meta && a.meta.ai), cutFrom: a.id }); })
            .then(function(n){ return loadMedia(n.id).then(function(){ return { asset: n, cut: true, mouth: DIRECTOR.mouth(cut.mask, cut.w, cut.h) }; }); }); });
    };
    $("#f-addchar").onclick = function(){ pickAsset(["image", "video"], "Pick or upload a character").then(function(a){ if (a) addChar(a); }); };
    $("#f-aichar").onclick = function(){
      var pr = prompt("Describe the character (AI image). Example: cartoon Bay Area rapper in a gold chain, full body, plain white background", "Cartoon character, full body, plain white background, ");
      if (!pr) return; status($("#f-st"), "Drawing the character (AI)…");
      aiService.image({ prompt: pr, aspect: "3:4", label: "AI character" }).then(function(a){ return cutAsset(a).then(function(r){ status($("#f-st"), "Character ready" + (r.cut ? ", cut out from its background." : ".") + (a.look ? " (" + aiService.lookName(a.look) + " look)" : "")); addChar(r.asset, r.mouth); }); }).catch(function(e){ status($("#f-st"), e.message); });
    };
    var setMouth = function(c){
      Assets.get(c.asset).then(function(a){
        if (!a || a.kind !== "image") { alert("Mouth points work on pictures. For a clip, upload a second picture with the mouth open."); return; }
        var pt = c.mouth || { x: 0.5, y: 0.35, w: 0.12 };
        dlg.innerHTML = '<h2>Where is ' + esc(c.name) + '\'s mouth?</h2><p class="note">Click the middle of the mouth. While they talk, an animated mouth moves there with the voice (shapes for A, E, O, M, S… read from the sound). Or give a second picture with the mouth open and RB swaps to it on loud sounds.</p>' +
          '<div class="mouthpick" id="mp"><img alt="" src="' + assetUrl(a) + '"><i id="mpdot"></i></div><div class="mt10 f">MOUTH WIDTH<input type="range" id="mpw" min="0.03" max="0.4" step="0.01"></div>' +
          (FLAGS.visemes ? '<div class="mt10 f">MOUTH MOVES' + seg("mmode", [["shapes", "Shapes from the voice"], ["simple", "Open and close"]], c.mouthMode === "simple" ? "simple" : "shapes") + '</div>' : "") +
          '<div class="mt12 row"><button class="btn" type="button" id="mp-open">Use a mouth-open picture…</button><span class="f1 sp"></span><button class="btn" type="button" id="mp-x">Cancel</button><button class="btn gold" type="button" id="mp-ok">Done</button></div>';
        var dot = $("#mpdot", dlg), place = function(){ dot.style.left = pt.x * 100 + "%"; dot.style.top = pt.y * 100 + "%"; dot.style.width = dot.style.height = "18px"; };
        $("#mpw", dlg).value = pt.w; place();
        $("#mp", dlg).onclick = function(e){ var r = this.getBoundingClientRect(); pt.x = (e.clientX - r.left) / r.width; pt.y = (e.clientY - r.top) / r.height; place(); };
        $("#mpw", dlg).oninput = function(){ pt.w = +this.value; };
        var mode = c.mouthMode === "simple" ? "simple" : "shapes", mm = $('[data-seg="mmode"]', dlg);
        if (mm) mm.onclick = function(e){ var b = e.target.closest("button"); if (!b) return; mode = b.dataset.v; $$("button", mm).forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); }); };
        $("#mp-x", dlg).onclick = function(){ dlg.close(); };
        $("#mp-ok", dlg).onclick = function(){ c.mouth = pt; c.mouthMode = mode; dlg.close(); save(); drawCast(); };
        $("#mp-open", dlg).onclick = function(){ dlg.close(); pickAsset(["image"], "Pick the mouth-open picture (same size and pose)").then(function(o){ if (o) { c.mouthAsset = o.id; loadMedia(o.id); save(); drawCast(); } }); };
        dlg.showModal();
      });
    };

    /* recording a line straight from the microphone */
    var recLine = function(i, btn){
      if (btn._stop) { btn._stop(); return; }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(ms){
        var mr = new MediaRecorder(ms), chunks = []; mr.ondataavailable = function(e){ if (e.data.size) chunks.push(e.data); };
        mr.onstop = function(){ ms.getTracks().forEach(function(t){ t.stop(); }); btn._stop = null; btn.textContent = "● Record"; var blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
          Assets.add(blob, "audio", "Line · " + (S().lines[i].text || "").slice(0, 30)).then(function(a){ S().lines[i].audio = a.id; return loadMedia(a.id); }).then(function(){ changed(); drawLines(); }); };
        mr.start(); btn.textContent = "■ Stop"; btn._stop = function(){ mr.stop(); };
      }).catch(function(){ status($("#f-st"), "Microphone blocked. Allow it in the browser's address bar."); });
    };

    view.addEventListener("click", function(e){
      var t = e.target.closest("button") || e.target, d = t.dataset || {};
      if (d.scn !== undefined) { sel = +d.scn; selActor = -1; redraw(); return; }
      if (t.id === "f-addscene") { var ns = newScene(); var last = S(); ns.actors = last.actors.map(function(a){ return Object.assign({}, a); }); ns.bg = Object.assign({}, last.bg); P.scenes.push(ns); sel = P.scenes.length - 1; selActor = -1; changed(); redraw(); return; }
      if (t.id === "f-dup") { var cp = JSON.parse(JSON.stringify(S())); cp.id = uid("s_"); P.scenes.splice(sel + 1, 0, cp); sel++; changed(); redraw(); return; }
      if (t.id === "f-del") { if (P.scenes.length < 2) return; if (!confirm("Delete this scene?")) return; P.scenes.splice(sel, 1); sel = Math.max(0, sel - 1); changed(); redraw(); return; }
      if (t.id === "f-left" && sel > 0) { var x = P.scenes.splice(sel, 1)[0]; P.scenes.splice(--sel, 0, x); changed(); redraw(); return; }
      if (t.id === "f-right" && sel < P.scenes.length - 1) { var y = P.scenes.splice(sel, 1)[0]; P.scenes.splice(++sel, 0, y); changed(); redraw(); return; }
      if (d.mouth) { setMouth(castById(d.mouth)); return; }
      if (d.cut) { var cc = castById(d.cut); Assets.get(cc.asset).then(function(a){ if (!a || a.kind !== "image") { status($("#f-st"), "Cut out works on pictures."); return; } status($("#f-st"), "Cutting out " + cc.name + "…");
        return cutAsset(a).then(function(r){ if (!r.cut) { status($("#f-st"), "The background around " + cc.name + " isn't one plain colour, so it was left as it is."); return; } cc.asset = r.asset.id; if (!cc.mouthAsset) cc.mouth = r.mouth; status($("#f-st"), cc.name + " is cut out. Check the mouth point (Mouth)."); changed(); drawCast(); }); }); return; }
      if (d.stage) { S().actors.push({ cast: d.stage, x: 0.3 + 0.4 * Math.random(), y: 0.95, scale: 1, flip: false }); selActor = S().actors.length - 1; changed(); drawCast(); return; }
      if (d.uncast) { if (!confirm("Remove this character from the film?")) return; P.cast = P.cast.filter(function(c){ return c.id !== d.uncast; }); P.scenes.forEach(function(s){ s.actors = s.actors.filter(function(a){ return a.cast !== d.uncast; }); s.lines = s.lines.filter(function(l){ return l.cast !== d.uncast; }); }); selActor = -1; changed(); redraw(); return; }
      if (d.actor !== undefined) { selActor = +d.actor; drawCast(); return; }
      if (t.id === "f-flip" && S().actors[selActor]) { S().actors[selActor].flip = !S().actors[selActor].flip; changed(); return; }
      if (t.id === "f-remove" && S().actors[selActor]) { S().actors.splice(selActor, 1); selActor = -1; changed(); drawCast(); return; }
      if (t.id === "f-addline") { if (!P.cast.length) { status($("#f-st"), "Add a character first."); return; } var who = S().actors[0] ? S().actors[0].cast : P.cast[0].id; S().lines.push({ id: uid("l_"), cast: who, text: "", audio: null }); changed(); drawLines(); return; }
      if (d.ldel !== undefined) { S().lines.splice(+d.ldel, 1); changed(); drawLines(); return; }
      if (d.lrec !== undefined) { recLine(+d.lrec, t); return; }
      if (d.llib !== undefined) { var li = +d.llib; pickAsset(["audio"], "Pick the line's audio").then(function(a){ if (!a) return; S().lines[li].audio = a.id; loadMedia(a.id).then(function(){ changed(); drawLines(); }); }); return; }
      if (d.lai !== undefined) {
        var L = S().lines[+d.lai]; if (!L.text.trim()) { status($("#f-st"), "Write the line first."); return; }
        t.disabled = true; status($("#f-st"), "Making the AI voice…");
        aiSpeech(L.text).then(function(a){ L.audio = a.id; return loadMedia(a.id); }).then(function(){ status($("#f-st"), "AI voice ready (Cloudflare Workers AI)."); changed(); drawLines(); }).catch(function(err){ status($("#f-st"), err.message); }).then(function(){ t.disabled = false; });
        return;
      }
      if (t.id === "f-bg") { pickAsset(["image", "video"], "Pick a background").then(function(a){ if (!a) return; S().bg.asset = a.id; loadMedia(a.id).then(changed); }); return; }
      if (t.id === "f-aibg") { var pr = prompt("Describe the scene's background (AI image):", "Cartoon city street at night, Oakland, neon gold signs, wide shot"); if (!pr) return; status($("#f-st"), "Drawing the background (AI)…"); var look = ""; aiService.image({ prompt: pr, style: P.look || null, aspect: P.aspect, label: "AI background" }).then(function(a){ look = a.look; S().bg.asset = a.id; return loadMedia(a.id); }).then(function(){ status($("#f-st"), "Background ready." + (look ? " (" + aiService.lookName(look) + " look)" : "")); changed(); }).catch(function(err){ status($("#f-st"), err.message); }); return; }
      if (t.id === "f-music") { pickAsset(["audio"], "Pick the music").then(function(a){ if (!a) return; P.music = a.id; $("#f-musicname").textContent = a.name; loadMedia(a.id).then(save); }); return; }
    });
    view.addEventListener("input", function(e){
      var t = e.target, d = t.dataset || {};
      if (d.ltext !== undefined) { S().lines[+d.ltext].text = t.value; clearTimeout(tmr); tmr = setTimeout(changed, 700); return; }
      if (t.id === "f-name") { P.name = t.value; clearTimeout(tmr); tmr = setTimeout(save, 600); }
      if (t.id === "f-scale" && S().actors[selActor]) { S().actors[selActor].scale = +t.value; clearTimeout(tmr); tmr = setTimeout(changed, 400); }
      if (t.id === "f-bgc") { S().bg.color = t.value.toUpperCase(); S().bg.asset = null; changed(); }
      if (t.id === "f-mvol") { P.musicVol = +t.value; save(); }
      if (t.id === "f-min") { S().min = Math.max(1, Math.min(60, +t.value || 3)); changed(); }
    });
    view.addEventListener("change", function(e){
      var t = e.target, d = t.dataset || {};
      if (d.lcast !== undefined) { S().lines[+d.lcast].cast = t.value; changed(); }
      if (t.id === "f-caps") { P.captions = t.checked; save(); }
    });
    bindSeg(view, function(name, v){ if (name === "dlen" || name === "dcast") { dopt[name] = v; return; } if (name === "aspect") { P.aspect = v; size(); } else if (name === "look" || name === "quality") P[name] = v; else S()[name] = v; changed(); });

    /* the AI Director: one idea in, a finished film out (script, characters, backgrounds, voices, score, edit) */
    var dopt = { dlen: "medium", dcast: "2" }, dbusy = false;
    var BASIC_CAM = { dolly: "push", orbit: "pull", rack: "speaker", light: "push" };
    var dsteps = function(list){ $("#d-steps").innerHTML = list.map(function(x, i){ return '<li data-ds="' + i + '">' + esc(x) + "</li>"; }).join(""); };
    var dmark = function(i, st, txt){ var li = $('#d-steps [data-ds="' + i + '"]'); if (!li) return; li.className = st || ""; if (txt) li.textContent = txt; };
    $("#d-go").onclick = function(){
      if (dbusy) return;
      var idea = $("#d-idea").value.trim();
      if (idea.length < 8) { status($("#d-st"), "Describe the film in a sentence first."); $("#d-idea").focus(); return; }
      var used = P.cast.length || P.scenes.some(function(x){ return x.lines.length || x.bg.asset || x.actors.length; });
      if (used && !confirm("Replace this film's scenes, cast and music with the AI Director's film? Everything you made stays in your library.")) return;
      var want = { scenes: DIRECTOR.LENGTHS[dopt.dlen] || 5, cast: Math.max(1, Math.min(3, +dopt.dcast || 2)) };
      var btn = this, st = $("#d-st"), look = P.look || undefined, waitMsg = function(sec){ status(st, "Pacing to the free AI tools' limits: carrying on in " + Math.round(sec) + " s…"); };
      dbusy = true; btn.disabled = true; btn.textContent = "Directing…"; stop();
      dsteps(["Writing the script", "Drawing the characters", "Painting the backgrounds", "Recording the voices", "Scoring and editing the film"]);
      dmark(0, "on"); status(st, "Writing the script…");
      var script, people = [], bgs = [], voices = {}, missed = [];
      DIRECTOR.paced(function(){ return aiText(DIRECTOR.prompt(idea, want.scenes, want.cast)).then(function(t){ var sc = DIRECTOR.parse(t, want); if (!sc) { var e = new Error("The script came back unreadable. Try the idea again in other words."); e.retry = 2; throw e; } return sc; }); }, 3, waitMsg)
      .then(function(sc){
        script = sc; dmark(0, "ok", "Script: “" + sc.title + "”, " + sc.scenes.length + " scenes");
        people = sc.characters.map(function(c, i){ return { id: uid("c_"), name: c.name, look: c.look, asset: null, mouth: null, mouthAsset: null, tone: DIRECTOR.TONES[i % DIRECTOR.TONES.length] }; });
        var who = function(n){ return people.filter(function(c){ return c.name === n; })[0] || people[0]; };
        /* the voices run alongside the pictures (each free tool has its own pace) */
        var total = 0, done = 0; sc.scenes.forEach(function(x){ total += x.lines.length; });
        dmark(3, "on", "Recording the voices (0 of " + total + ")");
        var vq = Promise.resolve();
        sc.scenes.forEach(function(x, si){ x.lines.forEach(function(l, li){ vq = vq.then(function(){
          var c = who(l.who);
          return DIRECTOR.paced(function(){ return aiSpeech(l.text); }, 6, null).then(function(a){
            if (c.tone === 1) return a;
            return decode(a).then(function(b){ return DIRECTOR.tone(b, c.tone); }).then(function(b){ return Assets.add(wavOf(b), "audio", "AI voice · " + c.name + " · " + l.text.slice(0, 30), { ai: true, text: l.text }); });
          }).then(function(a){ voices[si + ":" + li] = a.id; }).catch(function(){ missed.push("a voice line"); })
            .then(function(){ done++; dmark(3, "on", "Recording the voices (" + done + " of " + total + ")"); });
        }); }); });
        vq = vq.then(function(){ dmark(3, done && Object.keys(voices).length === total ? "ok" : "bad", Object.keys(voices).length + " of " + total + " lines voiced" + (Object.keys(voices).length < total ? " (the rest show as captions)" : "")); });
        /* the pictures, one at a time: characters, then the backgrounds */
        dmark(1, "on", "Drawing the characters (1 of " + people.length + ")");
        var iq = Promise.resolve();
        people.forEach(function(c, i){ iq = iq.then(function(){
          dmark(1, "on", "Drawing the characters (" + (i + 1) + " of " + people.length + ")"); status(st, "Drawing " + c.name + "…");
          return DIRECTOR.paced(function(){ return aiService.image({ prompt: c.look + ". Full body, standing, facing the viewer, arms relaxed, centred, on a plain flat light grey background, no text", aspect: "3:4", style: look, label: "AI character · " + c.name }); }, 6, waitMsg)
            .then(function(a){ a.name = "AI character · " + c.name; return cutAsset(a); }).then(function(r){ c.asset = r.asset.id; c.mouth = r.mouth; })
            .catch(function(){ missed.push(c.name + "'s picture"); });
        }); });
        iq = iq.then(function(){ var ok = people.filter(function(c){ return c.asset; }).length; dmark(1, ok === people.length ? "ok" : "bad", ok + " of " + people.length + " characters drawn and cut out"); });
        sc.scenes.forEach(function(x, i){ iq = iq.then(function(){
          dmark(2, "on", "Painting the backgrounds (" + (i + 1) + " of " + sc.scenes.length + ")"); status(st, "Painting scene " + (i + 1) + "…");
          return DIRECTOR.paced(function(){ return aiService.image({ prompt: x.setting + ". Wide establishing shot, empty of people, room at the bottom for characters to stand, no text", aspect: P.aspect, style: look, label: "AI background" }); }, 6, waitMsg)
            .then(function(a){ bgs[i] = a.id; }).catch(function(){ missed.push("scene " + (i + 1) + "'s background"); });
        }); });
        iq = iq.then(function(){ var ok = bgs.filter(Boolean).length; dmark(2, ok === sc.scenes.length ? "ok" : "bad", ok + " of " + sc.scenes.length + " backgrounds painted"); status(st, "Finishing the voices…"); });
        return Promise.all([iq, vq]);
      }).then(function(){
        /* the edit */
        dmark(4, "on"); status(st, "Scoring and editing…");
        var byName = function(n){ return people.filter(function(c){ return c.name === n; })[0] || people[0]; };
        P.cast = people.map(function(c){ return { id: c.id, name: c.name, asset: c.asset, mouth: c.mouth, mouthAsset: null }; }).filter(function(c){ return c.asset; });
        var onStage = function(c){ return c.asset; };
        P.scenes = script.scenes.map(function(x, i){
          var speakers = []; x.lines.forEach(function(l){ var c = byName(l.who); if (onStage(c) && speakers.indexOf(c) < 0) speakers.push(c); });
          var spots = DIRECTOR.stage(speakers.length || 1), last = i === script.scenes.length - 1;
          var cam = FLAGS.cams ? x.camera : (BASIC_CAM[x.camera] || x.camera);
          var o = { id: uid("s_"), bg: { asset: bgs[i] || null, color: "#120E0A" }, camera: cam, transition: i === 0 ? "fade" : (i % 3 === 2 ? "flash" : "fade"), min: 3,
            actors: speakers.map(function(c, k){ return { cast: c.id, x: spots[k].x, y: spots[k].y, scale: spots[k].scale, flip: false }; }),
            lines: x.lines.map(function(l, li){ var c = byName(l.who); return { id: uid("l_"), cast: onStage(c) ? c.id : (P.cast[0] && P.cast[0].id) || c.id, text: l.text, audio: voices[i + ":" + li] || null }; }) };
          if (i === 0) { o.title = script.title; o.sub = "An RB Create film · made with AI"; o.lead = 3.4; }
          if (last) { o.end = "Made with RB Create"; o.endSub = "Written, drawn, voiced and scored with AI"; o.tail = 3; }
          return o;
        });
        P.name = script.title; P.captions = true; sel = 0; selActor = -1;
        $("#f-name").value = P.name; $("#f-caps").checked = true;
        return loadAll().then(function(){ return DIRECTOR.score(plan().total, script.mood); })
          .then(function(b){ return Assets.add(wavOf(b), "audio", "Score · " + script.title, { generated: true, mood: script.mood }); })
          .then(function(a){ P.music = a.id; P.musicVol = 0.32; $("#f-mvol").value = 0.32; $("#f-musicname").textContent = a.name; return loadMedia(a.id); })
          .catch(function(){ missed.push("the music"); });
      }).then(function(){
        save(); redraw(); still();
        dmark(4, "ok", "Edited: " + fmtLen(plan().total) + " with titles, camera moves, captions and music");
        status(st, "Your film is ready. Press ▶ Play film" + (missed.length ? ". Not made this time: " + missed.join(", ") + "; you can add them by hand." : "."));
        if ($("#d-export").checked) $("#f-export").click();
      }).catch(function(e){ status(st, e.message || "The director stopped. Try again."); $$("#d-steps li.on").forEach(function(li){ li.className = "bad"; }); })
      .then(function(){ dbusy = false; btn.disabled = false; btn.textContent = "Make the whole film"; });
    };
    var fmtLen = function(t){ t = Math.round(t); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };

    /* dragging characters on the stage */
    var pos = function(e){ var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; };
    cv.addEventListener("pointerdown", function(e){
      if (playing) return; var p = pos(e), s = S(), hit = -1;
      s.actors.forEach(function(a, i){ var c = castById(a.cast), im = c && media[c.asset]; if (!ready(im)) return; var h = 0.62 * a.scale, w = h * (im.naturalWidth || im.videoWidth) / (im.naturalHeight || im.videoHeight) * cv.height / cv.width; if (p.x > a.x - w / 2 && p.x < a.x + w / 2 && p.y > a.y - h && p.y < a.y) hit = i; });
      selActor = hit; drawCast(); if (hit < 0) return;
      dragging = { i: hit, dx: s.actors[hit].x - p.x, dy: s.actors[hit].y - p.y }; cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener("pointermove", function(e){ if (!dragging) return; var p = pos(e), a = S().actors[dragging.i]; a.x = Math.max(0, Math.min(1, p.x + dragging.dx)); a.y = Math.max(0.1, Math.min(1.4, p.y + dragging.dy)); });
    cv.addEventListener("pointerup", function(){ if (dragging) { dragging = null; changed(); } });

    loadAll().then(function(){ if (P.music) Assets.get(P.music).then(function(a){ if (a) $("#f-musicname").textContent = a.name; }); redraw(); raf = requestAnimationFrame(idle); });
    save();
    cleanup = function(){ stop(); cancelAnimationFrame(raf); Object.keys(media).forEach(function(k){ var v = media[k]; if (v && v.pause) v.pause(); }); };
  });
}

route();
})();
